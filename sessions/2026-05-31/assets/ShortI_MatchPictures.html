<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Short I — Match the Picture</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: Arial, sans-serif;
  font-size: 13px;
  color: #111;
  padding: 22px 30px;
  max-width: 720px;
  margin: 0 auto;
}
h1 { font-size: 20px; text-align: center; margin-bottom: 4px; font-family: Georgia, serif; }
.subtitle { font-size: 12px; color: #666; text-align: center; margin-bottom: 16px; }
.name-row { font-size: 13px; margin-bottom: 16px; }
.fill { display: inline-block; border-bottom: 1.5px solid #888; vertical-align: bottom; }
.instruction {
  background: #f0f0f0;
  border-left: 4px solid #333;
  padding: 8px 12px;
  font-size: 14px;
  font-weight: bold;
  margin-bottom: 22px;
}
.match-area { display: flex; height: 660px; }
.words-col {
  width: 120px;
  display: flex;
  flex-direction: column;
  justify-content: space-around;
}
.word-card {
  border: 2.5px solid #333;
  border-radius: 8px;
  padding: 8px;
  text-align: center;
}
.word-num { font-size: 10px; color: #888; display: block; }
.word-text {
  font-family: 'Courier New', monospace;
  font-size: 22px;
  font-weight: bold;
  letter-spacing: 0.05em;
}
.gap { flex: 1; }
.pics-col {
  width: 155px;
  display: flex;
  flex-direction: column;
  justify-content: space-around;
  align-items: flex-end;
}
.pic-card {
  border: 2.5px solid #333;
  border-radius: 8px;
  padding: 5px 8px;
  width: 148px;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.pic-letter {
  font-size: 11px;
  color: #888;
  font-weight: bold;
  align-self: flex-start;
  margin-bottom: 2px;
}
.answer-key {
  margin-top: 20px;
  border-top: 1px dashed #ccc;
  padding-top: 8px;
  font-size: 10px;
  color: #bbb;
  text-align: center;
}
@media print { body { padding: 14px 20px; } }
</style>
</head>
<body>

<h1>Short /i/ — Match the Picture</h1>
<div class="subtitle">Listen for the /i/ sound in each word.</div>

<div class="name-row">
  Name:&nbsp;<span class="fill" style="width:220px">&nbsp;</span>
  &nbsp;&nbsp;&nbsp;Date:&nbsp;<span class="fill" style="width:130px">&nbsp;</span>
</div>

<div class="instruction">Draw a line from each word to its matching picture.</div>

<div class="match-area">
  <div class="words-col">
    <div class="word-card"><span class="word-num">1</span><span class="word-text">sit</span></div>
    <div class="word-card"><span class="word-num">2</span><span class="word-text">pin</span></div>
    <div class="word-card"><span class="word-num">3</span><span class="word-text">bin</span></div>
    <div class="word-card"><span class="word-num">4</span><span class="word-text">pig</span></div>
    <div class="word-card"><span class="word-num">5</span><span class="word-text">six</span></div>
    <div class="word-card"><span class="word-num">6</span><span class="word-text">ink</span></div>
  </div>

  <div class="gap"></div>

  <div class="pics-col">
    <div class="pic-card">
      <span class="pic-letter">A</span>
      <svg viewBox="0 0 64 60" width="90" height="78" xmlns="http://www.w3.org/2000/svg">
        <circle cx="32" cy="32" r="24" fill="none" stroke="#333" stroke-width="2.5"/>
        <path d="M 14 16 L 7 5 L 21 13" fill="none" stroke="#333" stroke-width="2.5"/>
        <path d="M 50 16 L 57 5 L 43 13" fill="none" stroke="#333" stroke-width="2.5"/>
        <circle cx="23" cy="25" r="3" fill="#333"/>
        <circle cx="41" cy="25" r="3" fill="#333"/>
        <ellipse cx="32" cy="41" rx="10" ry="7" fill="none" stroke="#333" stroke-width="2"/>
        <circle cx="28" cy="41" r="2" fill="#333"/>
        <circle cx="36" cy="41" r="2" fill="#333"/>
      </svg>
    </div>
    <div class="pic-card">
      <span class="pic-letter">B</span>
      <svg viewBox="0 0 64 64" width="72" height="72" xmlns="http://www.w3.org/2000/svg">
        <text x="32" y="52" font-size="54" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" fill="#333">6</text>
      </svg>
    </div>
    <div class="pic-card">
      <span class="pic-letter">C</span>
      <svg viewBox="0 0 80 72" width="100" height="82" xmlns="http://www.w3.org/2000/svg">
        <rect x="10" y="40" width="52" height="4" fill="none" stroke="#aaa" stroke-width="2"/>
        <rect x="8" y="22" width="4" height="22" fill="none" stroke="#aaa" stroke-width="2"/>
        <line x1="12" y1="44" x2="12" y2="66" stroke="#aaa" stroke-width="2"/>
        <line x1="60" y1="44" x2="60" y2="66" stroke="#aaa" stroke-width="2"/>
        <circle cx="24" cy="11" r="8" fill="none" stroke="#333" stroke-width="2.5"/>
        <line x1="24" y1="19" x2="24" y2="40" stroke="#333" stroke-width="2.5"/>
        <line x1="24" y1="27" x2="11" y2="35" stroke="#333" stroke-width="2"/>
        <line x1="24" y1="27" x2="37" y2="35" stroke="#333" stroke-width="2"/>
        <line x1="24" y1="40" x2="60" y2="40" stroke="#333" stroke-width="2.5"/>
        <line x1="60" y1="40" x2="60" y2="62" stroke="#333" stroke-width="2.5"/>
        <line x1="53" y1="62" x2="67" y2="62" stroke="#333" stroke-width="2"/>
      </svg>
    </div>
    <div class="pic-card">
      <span class="pic-letter">D</span>
      <svg viewBox="0 0 54 66" width="64" height="76" xmlns="http://www.w3.org/2000/svg">
        <rect x="13" y="28" width="28" height="30" rx="4" fill="none" stroke="#333" stroke-width="2.5"/>
        <rect x="19" y="17" width="16" height="13" fill="none" stroke="#333" stroke-width="2"/>
        <rect x="16" y="10" width="22" height="9" rx="3" fill="#444"/>
        <rect x="17" y="36" width="20" height="12" rx="2" fill="none" stroke="#333" stroke-width="1.5"/>
        <text x="27" y="47" font-size="8.5" text-anchor="middle" font-family="Arial" font-weight="bold" fill="#333">INK</text>
      </svg>
    </div>
    <div class="pic-card">
      <span class="pic-letter">E</span>
      <svg viewBox="0 0 60 65" width="70" height="76" xmlns="http://www.w3.org/2000/svg">
        <path d="M 10 22 L 50 22 L 45 60 L 15 60 Z" fill="none" stroke="#333" stroke-width="2.5"/>
        <rect x="7" y="14" width="46" height="8" rx="2" fill="none" stroke="#333" stroke-width="2.5"/>
        <path d="M 22 14 Q 30 5 38 14" fill="none" stroke="#333" stroke-width="2.5"/>
        <line x1="14" y1="36" x2="46" y2="36" stroke="#ccc" stroke-width="1.5"/>
        <line x1="13" y1="48" x2="47" y2="48" stroke="#ccc" stroke-width="1.5"/>
      </svg>
    </div>
    <div class="pic-card">
      <span class="pic-letter">F</span>
      <svg viewBox="0 0 42 66" width="50" height="76" xmlns="http://www.w3.org/2000/svg">
        <circle cx="21" cy="12" r="9" fill="none" stroke="#333" stroke-width="2.5"/>
        <line x1="21" y1="21" x2="21" y2="53" stroke="#333" stroke-width="2.5"/>
        <polygon points="15,51 27,51 21,63" fill="#333"/>
      </svg>
    </div>
  </div>
</div>

<div class="answer-key">Answer key (tutor): &nbsp; 1–C &nbsp;|&nbsp; 2–F &nbsp;|&nbsp; 3–E &nbsp;|&nbsp; 4–A &nbsp;|&nbsp; 5–B &nbsp;|&nbsp; 6–D</div>

</body>
</html>
