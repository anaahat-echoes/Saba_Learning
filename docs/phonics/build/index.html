<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Build a Word</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --purple:       #7048e8;
  --purple-dark:  #5f3dc4;
  --green:        #2f9e44;
  --green-light:  #d3f9d8;
  --red:          #e03131;
  --red-light:    #ffe3e3;
  --orange:       #f08c00;
  --orange-dark:  #b56a00;
  --gray:         #868e96;
  --bg:           #1a1a2e;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  min-height: 100vh;
  color: #fff;
  -webkit-tap-highlight-color: transparent;
}

.screen { display: none; min-height: 100vh; }
.screen.active { display: flex; flex-direction: column; }

/* ── Shared layout ─────────────────────────── */
.page-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 20px 12px;
}

.back-btn {
  background: rgba(255,255,255,0.12);
  border: none;
  border-radius: 50%;
  width: 40px; height: 40px;
  font-size: 1.1rem;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 6px rgba(0,0,0,0.3);
  flex-shrink: 0;
  color: #fff;
  text-decoration: none;
}

.page-title {
  font-size: 1.05rem;
  font-weight: 700;
  color: #fff;
  flex: 1;
}

/* ── Activity Picker ──────────────────────── */
#screen-pick {
  padding: 0 20px 32px;
}

.pick-heading {
  font-size: 1.5rem;
  font-weight: 900;
  color: #fff;
  margin-bottom: 6px;
  padding: 0 4px;
}

.pick-sub {
  font-size: 0.9rem;
  color: var(--gray);
  margin-bottom: 22px;
  padding: 0 4px;
}

.section-label {
  font-size: 0.75rem;
  font-weight: 800;
  color: var(--gray);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  padding: 0 4px;
  margin: 18px 0 10px;
}

.activity-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  max-width: 480px;
  margin: 0 auto;
}

.act-btn {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 16px 20px;
  border: none;
  border-radius: 20px;
  background: rgba(255,255,255,0.08);
  box-shadow: 0 4px 0 rgba(0,0,0,0.25);
  cursor: pointer;
  text-align: left;
  transition: transform 0.1s, box-shadow 0.1s;
  width: 100%;
  text-decoration: none;
  color: #fff;
  border-left: 5px solid var(--purple);
}

.act-btn:active {
  transform: translateY(3px);
  box-shadow: 0 1px 0 rgba(0,0,0,0.25);
}

.act-emoji {
  font-size: 2.4rem;
  line-height: 1;
  min-width: 48px;
  text-align: center;
}

.act-info { flex: 1; }

.act-name {
  font-size: 1.05rem;
  font-weight: 800;
  color: #fff;
  display: block;
  margin-bottom: 3px;
}

.act-words {
  font-size: 0.8rem;
  color: var(--gray);
  font-family: 'Courier New', monospace;
  letter-spacing: 0.03em;
}

.act-best {
  font-size: 0.75rem;
  font-weight: 700;
  color: var(--purple);
  text-align: right;
  white-space: nowrap;
}

/* ── Game Screen ──────────────────────────── */
#screen-game {
  padding-bottom: 24px;
}

.game-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 20px 10px;
}

.progress-track {
  flex: 1;
  height: 8px;
  background: rgba(255,255,255,0.12);
  border-radius: 4px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: var(--purple);
  border-radius: 4px;
  transition: width 0.4s ease;
  width: 0%;
}

.round-label {
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--gray);
  white-space: nowrap;
}

/* ── Emoji + Slots area ───────────────────── */
.word-display {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 16px 20px 8px;
}

.word-emoji {
  font-size: 4.5rem;
  line-height: 1;
  margin-bottom: 20px;
  user-select: none;
}

.slots-row {
  display: flex;
  gap: 12px;
  justify-content: center;
  margin-bottom: 16px;
}

.slot {
  width: 60px;
  height: 72px;
  border-radius: 14px;
  border: 3px dashed rgba(255,255,255,0.25);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Courier New', monospace;
  font-size: 2rem;
  font-weight: 900;
  color: #fff;
  background: rgba(255,255,255,0.05);
  transition: border-color 0.2s, background 0.2s, transform 0.2s;
}

.slot.filled {
  border: 3px solid var(--green);
  background: rgba(47,158,68,0.15);
  animation: popIn 0.3s ease;
}

@keyframes popIn {
  0%   { transform: scale(0.7); }
  50%  { transform: scale(1.15); }
  100% { transform: scale(1); }
}

/* ── Hear button ──────────────────────────── */
.hear-wrap {
  display: flex;
  justify-content: center;
  padding: 0 20px 20px;
}

.hear-btn {
  background: var(--orange);
  color: #fff;
  border: none;
  border-radius: 50px;
  padding: 14px 32px;
  font-size: 1.05rem;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 5px 0 var(--orange-dark);
  transition: transform 0.1s, box-shadow 0.1s;
  display: flex;
  align-items: center;
  gap: 10px;
}

.hear-btn:active {
  transform: translateY(4px);
  box-shadow: 0 1px 0 var(--orange-dark);
}

.hear-btn.replaying { background: #e8590c; }

/* ── Letter grid ──────────────────────────── */
.letter-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  padding: 0 28px;
  max-width: 380px;
  margin: 0 auto;
}

.letter-btn {
  border-radius: 18px;
  font-size: 1.8rem;
  font-weight: 900;
  font-family: 'Courier New', monospace;
  box-shadow: 0 4px 0 rgba(0,0,0,0.25);
  border: none;
  background: rgba(255,255,255,0.12);
  color: #fff;
  padding: 16px 0;
  cursor: pointer;
  transition: transform 0.1s, box-shadow 0.1s, opacity 0.3s, background 0.2s;
  -webkit-tap-highlight-color: transparent;
  text-transform: lowercase;
}

.letter-btn:active {
  transform: translateY(3px);
  box-shadow: 0 1px 0 rgba(0,0,0,0.25);
}

.letter-btn.used {
  opacity: 0.2;
  pointer-events: none;
}

.letter-btn.wrong-shake {
  animation: shake 0.4s ease;
  background: rgba(224,49,49,0.3);
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-8px); }
  40% { transform: translateX(8px); }
  60% { transform: translateX(-6px); }
  80% { transform: translateX(6px); }
}

/* ── Feedback ─────────────────────────────── */
.feedback {
  text-align: center;
  padding: 16px 20px 0;
  font-size: 1rem;
  font-weight: 700;
  min-height: 52px;
}

.feedback.correct-msg { color: var(--green); }
.feedback.wrong-msg   { color: var(--red); }
.feedback.hidden      { visibility: hidden; }

/* ── Result Screen ───────────────────────── */
#screen-result {
  align-items: center;
  justify-content: center;
  padding: 32px 24px;
  text-align: center;
}

.result-stars {
  font-size: 3rem;
  margin-bottom: 16px;
  letter-spacing: 4px;
}

.result-score {
  font-size: 2rem;
  font-weight: 900;
  color: #fff;
  margin-bottom: 8px;
}

.result-msg {
  font-size: 1rem;
  color: var(--gray);
  margin-bottom: 20px;
}

.result-btns {
  display: flex;
  flex-direction: column;
  gap: 14px;
  width: 100%;
  max-width: 300px;
}

.btn-primary {
  background: var(--purple);
  color: #fff;
  border: none;
  border-radius: 50px;
  padding: 18px 32px;
  font-size: 1.05rem;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 5px 0 var(--purple-dark);
  transition: transform 0.1s, box-shadow 0.1s;
}

.btn-primary:active {
  transform: translateY(4px);
  box-shadow: 0 1px 0 var(--purple-dark);
}

.btn-secondary {
  background: transparent;
  color: var(--purple);
  border: 2px solid var(--purple);
  border-radius: 50px;
  padding: 16px 32px;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.15s;
}

.btn-secondary:active { background: rgba(112,72,232,0.15); }
</style>
</head>
<body>

<!-- ── SCREEN 1: Set Picker ─────────────────── -->
<div id="screen-pick" class="screen active">
  <div class="page-header">
    <a href="../" class="back-btn" aria-label="Back to Word World">&#8592;</a>
    <span class="page-title">&#128296; Build a Word</span>
  </div>

  <div style="padding: 8px 24px 0;">
    <div class="pick-heading">Pick your words!</div>
    <div class="pick-sub">Hear a word, then tap letters to spell it</div>
  </div>

  <div class="activity-list" style="padding: 0 4px;" id="set-list">
    <!-- populated by JS -->
  </div>
</div>

<!-- ── SCREEN 2: Game ──────────────────────── -->
<div id="screen-game" class="screen">
  <div class="game-header">
    <button class="back-btn" onclick="goToPicker()" aria-label="Back to sets">&#8592;</button>
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
    <div class="round-label" id="round-label">1 / 6</div>
  </div>

  <div class="word-display">
    <div class="word-emoji" id="word-emoji"></div>
    <div class="slots-row" id="slots-row"></div>
  </div>

  <div class="hear-wrap">
    <button class="hear-btn" id="hear-btn" onclick="playWord()">
      <span>&#128264;</span>
      <span id="hear-text">Tap to hear</span>
    </button>
  </div>

  <div class="letter-grid" id="letter-grid"></div>

  <div class="feedback hidden" id="feedback" aria-live="polite"></div>
</div>

<!-- ── SCREEN 3: Result ────────────────────── -->
<div id="screen-result" class="screen">
  <div class="result-stars" id="result-stars"></div>
  <div class="result-score" id="result-score"></div>
  <div class="result-msg" id="result-msg"></div>
  <div class="result-btns">
    <button class="btn-primary" onclick="playAgain()">Play again</button>
    <button class="btn-secondary" onclick="goToPicker()">Back to Word World</button>
  </div>
</div>

<script>
// ── Word Bank ────────────────────────────────────────────
var WORD_BANK = {
  bad: '👎', bat: '🏏', bed: {pic:'🛏️', distractors:['a','t']},
  big: '🐻', bug: '🐛',
  bus: '🚌', cat: '🐱', cup: '☕', dig: '⛏️', dog: '🐕',
  drop: '💧', dug: '🕳️', fog: '🌫️', hat: '🎩', hen: '🐔',
  hid: '🫣', jet: '✈️', jug: '🏺', net: '🕸️',
};

// Normalise entries: each becomes {pic, distractors?}
Object.keys(WORD_BANK).forEach(function(w) {
  var v = WORD_BANK[w];
  if (typeof v === 'string') WORD_BANK[w] = {pic: v};
});

// ── Word Sets ────────────────────────────────────────────
var WORD_SETS = [
  {
    key: 'today',
    name: "Today's Words",
    words: ['dog','bus','cup','jet','fog','bed'],
    emoji: '🔥'
  },
  {
    key: 'more-cvc',
    name: 'More CVC Words',
    words: ['hat','bug','dug','big','hen','bat'],
    emoji: '⭐'
  },
];

// ── Star/Diamond scoring ─────────────────────────────────
var KNOWN = 'bcdfghij'.split('');

function scoreIcon(word) {
  var first = word[0].toLowerCase();
  return KNOWN.indexOf(first) >= 0 ? '⭐' : '💎';
}

// ── Game state ───────────────────────────────────────────
var currentSetKey = null;
var currentWords  = [];
var wordIndex     = 0;
var slotIndex     = 0;
var score         = 0;
var totalWords    = 0;
var answered      = false;
var wordPlayed    = false;
var missedWords   = [];
var scoreIcons    = [];

// ── Utils ────────────────────────────────────────────────
function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

// ── TTS ──────────────────────────────────────────────────
function speak(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  var utt = new SpeechSynthesisUtterance(text);
  utt.lang  = 'en-GB';
  utt.rate  = 0.82;
  utt.pitch = 1.05;
  window.speechSynthesis.speak(utt);
}

// ── Screens ──────────────────────────────────────────────
function showScreen(id) {
  var screens = document.querySelectorAll('.screen');
  for (var i = 0; i < screens.length; i++) screens[i].classList.remove('active');
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

// ── Picker ───────────────────────────────────────────────
function goToPicker() {
  renderPicker();
  showScreen('screen-pick');
}

function renderPicker() {
  var list = document.getElementById('set-list');
  list.innerHTML = '';
  WORD_SETS.forEach(function(set) {
    var saved = loadProgress(set.key);
    var bestText = saved && saved.bestScore > 0
      ? 'Best: ' + saved.bestScore + '/' + set.words.length
      : '';

    var btn = document.createElement('button');
    btn.className = 'act-btn';
    btn.setAttribute('aria-label', set.name);
    btn.onclick = function() { startGame(set.key); };
    btn.innerHTML =
      '<span class="act-emoji">' + set.emoji + '</span>' +
      '<span class="act-info">' +
        '<span class="act-name">' + set.name + '</span>' +
        '<span class="act-words">' + set.words.join(' · ') + '</span>' +
      '</span>' +
      '<span class="act-best">' + bestText + '</span>';
    list.appendChild(btn);
  });
}

// ── localStorage ─────────────────────────────────────────
function storageKey(setKey) { return 'saba_build_' + setKey; }

function loadProgress(setKey) {
  try {
    return JSON.parse(localStorage.getItem(storageKey(setKey)) || 'null');
  } catch(e) { return null; }
}

function saveProgress(setKey, score, missed) {
  try {
    var prev = loadProgress(setKey) || {played:0, bestScore:0};
    prev.played     = (prev.played || 0) + 1;
    prev.bestScore  = Math.max(prev.bestScore || 0, score);
    prev.lastPlayed = new Date().toISOString().slice(0, 10);
    prev.lastMissed = missed;
    prev.totalWords = totalWords;
    localStorage.setItem(storageKey(setKey), JSON.stringify(prev));
  } catch(e) {}
}

// ── Distractor generation ────────────────────────────────
var ALL_LETTERS = 'abcdefghijklmnopqrstuvwxyz'.split('');

function getDistractors(word) {
  var entry = WORD_BANK[word];
  if (entry && entry.distractors) return entry.distractors.slice();

  var letters = word.split('');
  var pool = ALL_LETTERS.filter(function(l) { return letters.indexOf(l) < 0; });
  pool = shuffle(pool);
  // Return 3 distractors (for CVC, we have 3 correct + 3 distractor = 6 tiles)
  var needed = 3;
  return pool.slice(0, needed);
}

// ── Game start ───────────────────────────────────────────
function startGame(setKey) {
  currentSetKey = setKey;
  var set = WORD_SETS.filter(function(s) { return s.key === setKey; })[0];
  currentWords = shuffle(set.words.slice());
  totalWords   = currentWords.length;
  wordIndex    = 0;
  score        = 0;
  missedWords  = [];
  scoreIcons   = [];

  showScreen('screen-game');
  renderWord();
}

// ── Render a word round ──────────────────────────────────
function renderWord() {
  answered   = false;
  wordPlayed = false;
  slotIndex  = 0;

  var word  = currentWords[wordIndex];
  var entry = WORD_BANK[word];
  var pic   = entry ? entry.pic : '?';
  var letters = word.split('');

  // Progress
  document.getElementById('progress-fill').style.width =
    (wordIndex / totalWords * 100) + '%';
  document.getElementById('round-label').textContent =
    (wordIndex + 1) + ' / ' + totalWords;

  // Emoji
  document.getElementById('word-emoji').innerHTML = pic;

  // Build slots
  var slotsRow = document.getElementById('slots-row');
  slotsRow.innerHTML = '';
  for (var i = 0; i < letters.length; i++) {
    var slot = document.createElement('div');
    slot.className = 'slot';
    slot.id = 'slot-' + i;
    slot.setAttribute('data-letter', letters[i]);
    slotsRow.appendChild(slot);
  }

  // Build letter grid: correct letters + distractors, shuffled
  var distractors = getDistractors(word);
  var allLetters = shuffle(letters.concat(distractors));

  var grid = document.getElementById('letter-grid');
  grid.innerHTML = '';
  // Adjust columns based on total letters
  grid.style.gridTemplateColumns = allLetters.length <= 6
    ? 'repeat(3, 1fr)' : 'repeat(4, 1fr)';

  allLetters.forEach(function(letter, idx) {
    var btn = document.createElement('button');
    btn.className = 'letter-btn';
    btn.id = 'lbtn-' + idx;
    btn.textContent = letter;
    btn.onclick = function() { handleLetterTap(idx, letter); };
    grid.appendChild(btn);
  });

  // Reset hear button
  document.getElementById('hear-text').textContent = 'Tap to hear';
  document.getElementById('hear-btn').classList.remove('replaying');

  // Reset feedback
  var fb = document.getElementById('feedback');
  fb.textContent = '';
  fb.className   = 'feedback hidden';
}

// ── Hear button ──────────────────────────────────────────
function playWord() {
  speak(currentWords[wordIndex]);
  if (!wordPlayed) {
    wordPlayed = true;
    document.getElementById('hear-text').textContent = 'Hear it again';
    document.getElementById('hear-btn').classList.add('replaying');
  }
}

// ── Letter tap ───────────────────────────────────────────
function handleLetterTap(btnIdx, letter) {
  if (answered) return;

  var word = currentWords[wordIndex];
  var expected = word[slotIndex];

  var btn = document.getElementById('lbtn-' + btnIdx);

  if (letter === expected) {
    // Correct
    btn.classList.add('used');
    var slot = document.getElementById('slot-' + slotIndex);
    slot.textContent = letter;
    slot.classList.add('filled');
    slotIndex++;

    // Check if word complete
    if (slotIndex >= word.length) {
      answered = true;
      score++;
      scoreIcons.push(scoreIcon(word));

      var fb = document.getElementById('feedback');
      fb.textContent = '✓ ' + word + '!';
      fb.className   = 'feedback correct-msg';

      // Say the completed word
      setTimeout(function() { speak(word); }, 300);

      // Advance after 1.8s
      setTimeout(function() { advanceWord(); }, 1800);
    }
  } else {
    // Wrong letter - shake the button
    if (!btn.classList.contains('used')) {
      btn.classList.add('wrong-shake');
      // Track miss for this word (only once per word)
      if (missedWords.indexOf(word) < 0) {
        missedWords.push(word);
      }
      setTimeout(function() {
        btn.classList.remove('wrong-shake');
      }, 400);
    }
  }
}

// ── Advance to next word ─────────────────────────────────
function advanceWord() {
  wordIndex++;
  if (wordIndex >= totalWords) {
    endGame();
  } else {
    renderWord();
  }
}

// ── End game ─────────────────────────────────────────────
function endGame() {
  saveProgress(currentSetKey, score, missedWords);
  showResult();
}

// ── Result ───────────────────────────────────────────────
var MESSAGES = [
  ['Amazing! Every single one!',  3],
  ['Great job — nearly there!',    2],
  ['Good try — keep practising!',  1],
  ["Let's try again!",            0],
];

function showResult() {
  showScreen('screen-result');

  var pct  = score / totalWords;
  var tier = pct >= 0.9 ? 0 : pct >= 0.7 ? 1 : pct >= 0.5 ? 2 : 3;
  var msg  = MESSAGES[tier][0];

  // Build star/diamond display from scoreIcons
  var iconStr = scoreIcons.length > 0 ? scoreIcons.join('') : '';
  // If no icons (shouldn't happen), fall back
  if (!iconStr) {
    var starCount = MESSAGES[tier][1];
    iconStr = '';
    for (var i = 0; i < 3; i++) {
      iconStr += i < starCount ? '⭐' : '☆';
    }
  }

  document.getElementById('result-stars').textContent = iconStr;
  document.getElementById('result-score').textContent = score + ' out of ' + totalWords;
  document.getElementById('result-msg').textContent   = msg;
}

function playAgain() { startGame(currentSetKey); }

// ── Init ─────────────────────────────────────────────────
renderPicker();
</script>

</body>
</html>
