<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Saba's Phonics</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --purple:       #7048e8;
  --purple-dark:  #5f3dc4;
  --purple-light: #F3F0FF;
  --green:        #2f9e44;
  --green-light:  rgba(47,158,68,0.2);
  --red:          #e03131;
  --red-light:    rgba(224,49,49,0.15);
  --orange:       #f08c00;
  --orange-dark:  #b56a00;
  --gray:         rgba(255,255,255,0.5);
  --bg:           #1a1a2e;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  min-height: 100vh;
  color: #fff;
  -webkit-tap-highlight-color: transparent;
}

.screen { display: none; min-height: 100vh; }
.screen.active { display: flex; flex-direction: column; }

/* ── Shared layout ─────────────────────────── */
.page-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 20px 12px;
}

.back-btn {
  background: rgba(255,255,255,0.1);
  border: none;
  border-radius: 50%;
  width: 40px; height: 40px;
  font-size: 1.1rem;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  color: rgba(255,255,255,0.7);
  text-decoration: none;
}

.page-title {
  font-size: 1.05rem;
  font-weight: 700;
  color: rgba(255,255,255,0.9);
  flex: 1;
}

/* ── Activity Picker ──────────────────────── */
#screen-pick {
  padding: 0 20px 32px;
}

.pick-heading {
  font-size: 1.5rem;
  font-weight: 900;
  color: #fff;
  margin-bottom: 6px;
  padding: 0 4px;
}

.pick-sub {
  font-size: 0.9rem;
  color: rgba(255,255,255,0.5);
  margin-bottom: 22px;
  padding: 0 4px;
}

.section-label {
  font-size: 0.75rem;
  font-weight: 800;
  color: var(--gray);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  padding: 0 4px;
  margin: 18px 0 10px;
}

.activity-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  max-width: 480px;
  margin: 0 auto;
}

.act-btn {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 16px 20px;
  border: none;
  border-radius: 20px;
  background: rgba(255,255,255,0.06);
  border: 2px solid rgba(255,255,255,0.08);
  box-shadow: 0 4px 0 rgba(0,0,0,0.25);
  cursor: pointer;
  text-align: left;
  transition: transform 0.1s, box-shadow 0.1s;
  width: 100%;
  text-decoration: none;
  color: #fff;
}

.act-btn:active {
  transform: translateY(3px);
  box-shadow: 0 1px 0 rgba(0,0,0,0.25);
}

.act-emoji {
  font-size: 2.4rem;
  line-height: 1;
  min-width: 48px;
  text-align: center;
}

.act-info { flex: 1; }

.act-name {
  font-size: 1.05rem;
  font-weight: 800;
  color: #fff;
  display: block;
  margin-bottom: 3px;
}

.act-words {
  font-size: 0.8rem;
  color: rgba(255,255,255,0.45);
  font-family: 'Courier New', monospace;
  letter-spacing: 0.03em;
}

.act-best {
  font-size: 0.75rem;
  font-weight: 700;
  color: #a78bfa;
  text-align: right;
  white-space: nowrap;
}

.act-btn.level-a  { border-left: 5px solid #f08c00; }
.act-btn.level-e  { border-left: 5px solid #2f9e44; }
.act-btn.level-ae { border-left: 5px solid var(--purple); }
.act-btn.level-ladder { border-left: 5px solid #1971c2; }

.progress-link {
  display: block;
  text-align: center;
  margin-top: 28px;
  font-size: 0.9rem;
  font-weight: 700;
  color: #a78bfa;
  text-decoration: none;
}

/* ── Game Screen ──────────────────────────── */
#screen-game {
  padding-bottom: 24px;
}

.game-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 20px 10px;
}

.progress-track {
  flex: 1;
  height: 8px;
  background: rgba(255,255,255,0.1);
  border-radius: 4px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: var(--purple);
  border-radius: 4px;
  transition: width 0.4s ease;
  width: 0%;
}

.round-label {
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--gray);
  white-space: nowrap;
}

.set-label {
  text-align: center;
  font-size: 0.85rem;
  font-weight: 700;
  color: #a78bfa;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  padding: 4px 20px 16px;
}

.hear-wrap {
  display: flex;
  justify-content: center;
  padding: 0 20px 24px;
}

.hear-btn {
  background: var(--orange);
  color: #fff;
  border: none;
  border-radius: 50px;
  padding: 16px 36px;
  font-size: 1.15rem;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 5px 0 var(--orange-dark);
  transition: transform 0.1s, box-shadow 0.1s;
  display: flex;
  align-items: center;
  gap: 10px;
}

.hear-btn:active {
  transform: translateY(4px);
  box-shadow: 0 1px 0 var(--orange-dark);
}

.hear-btn.replaying { background: #e8590c; }

.cards-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  padding: 0 20px;
  margin: 0 auto;
  max-width: 480px;
}

.card {
  background: rgba(255,255,255,0.08);
  border-radius: 24px;
  border: 3px solid transparent;
  box-shadow: 0 4px 0 rgba(0,0,0,0.25);
  padding: 20px 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  cursor: pointer;
  transition: transform 0.1s, box-shadow 0.1s, border-color 0.2s, background 0.2s;
  min-height: 150px;
  -webkit-tap-highlight-color: transparent;
}

.card:active { transform: scale(0.96); }

.card-pic {
  font-size: 3.5rem;
  line-height: 1;
  user-select: none;
}

.card-word {
  font-family: 'Courier New', monospace;
  font-size: 1.3rem;
  font-weight: 700;
  color: rgba(255,255,255,0.7);
  letter-spacing: 0.08em;
}

.card.correct {
  border-color: var(--green);
  background: rgba(47,158,68,0.2);
}

.card.wrong {
  border-color: var(--red);
  background: rgba(224,49,49,0.15);
  animation: shake 0.4s ease;
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-8px); }
  40% { transform: translateX(8px); }
  60% { transform: translateX(-6px); }
  80% { transform: translateX(6px); }
}

.feedback {
  text-align: center;
  padding: 16px 20px 0;
  font-size: 1rem;
  font-weight: 700;
  min-height: 52px;
}

.feedback.correct-msg { color: var(--green); }
.feedback.wrong-msg   { color: var(--red); }
.feedback.hidden      { visibility: hidden; }

/* ── Result Screen ───────────────────────── */
#screen-result {
  align-items: center;
  justify-content: center;
  padding: 32px 24px;
  text-align: center;
}

.result-stars {
  font-size: 3rem;
  margin-bottom: 16px;
  letter-spacing: 4px;
}

.result-score {
  font-size: 2rem;
  font-weight: 900;
  color: #a78bfa;
  margin-bottom: 8px;
}

.result-msg {
  font-size: 1rem;
  color: var(--gray);
  margin-bottom: 20px;
}

.rem-result {
  display: none;
  background: rgba(47,158,68,0.15);
  border-radius: 16px;
  padding: 14px 20px;
  margin-bottom: 24px;
  font-size: 0.95rem;
  font-weight: 700;
  color: var(--green);
}

.result-btns {
  display: flex;
  flex-direction: column;
  gap: 14px;
  width: 100%;
  max-width: 300px;
}

.btn-primary {
  background: var(--purple);
  color: #fff;
  border: none;
  border-radius: 50px;
  padding: 18px 32px;
  font-size: 1.05rem;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 5px 0 var(--purple-dark);
  transition: transform 0.1s, box-shadow 0.1s;
}

.btn-primary:active {
  transform: translateY(4px);
  box-shadow: 0 1px 0 var(--purple-dark);
}

.btn-secondary {
  background: transparent;
  color: rgba(255,255,255,0.6);
  border: 2px solid rgba(255,255,255,0.2);
  border-radius: 50px;
  padding: 16px 32px;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
}
</style>
</head>
<body>

<!-- ── SCREEN 1: Activity Picker ─────────── -->
<div id="screen-pick" class="screen active">
  <div class="page-header">
    <a href="../" class="back-btn" aria-label="Home">←</a>
    <span class="page-title">Word World</span>
  </div>

  <div style="padding: 8px 24px 0;">
    <div class="pick-heading">What shall we practise?</div>
    <div class="pick-sub">Tap an activity to start</div>
  </div>

  <div class="activity-list" style="padding: 0 4px;">
    <div class="section-label" style="margin-top:4px;">Listen &amp; Match</div>

    <button class="act-btn level-a" onclick="startGame('short-a')" aria-label="Short A words">
      <span class="act-emoji">🎩</span>
      <span class="act-info">
        <span class="act-name">Short A words</span>
        <span class="act-words">cat · hat · pan · bag · van</span>
      </span>
      <span class="act-best" id="best-short-a"></span>
    </button>

    <button class="act-btn level-e" onclick="startGame('short-e')" aria-label="Short E words">
      <span class="act-emoji">🐔</span>
      <span class="act-info">
        <span class="act-name">Short E words</span>
        <span class="act-words">hen · net · pen · bed · egg</span>
      </span>
      <span class="act-best" id="best-short-e"></span>
    </button>

    <button class="act-btn level-ae" onclick="startGame('a-vs-e')" aria-label="A versus E contrast">
      <span class="act-emoji">🎯</span>
      <span class="act-info">
        <span class="act-name">A vs E — hear the difference</span>
        <span class="act-words">pan vs pen · hat vs hen · bat vs bed</span>
      </span>
      <span class="act-best" id="best-a-vs-e"></span>
    </button>

    <div class="section-label">Word Ladders</div>

    <a href="ladders/" class="act-btn level-ladder" aria-label="Word Ladders game">
      <span class="act-emoji">🪜</span>
      <span class="act-info">
        <span class="act-name">Word Ladders</span>
        <span class="act-words">-at · -an · -et · -en</span>
      </span>
      <span class="act-best">▶</span>
    </a>

    <div class="section-label">Build a Word</div>

    <a href="build/" class="act-btn level-ladder" aria-label="Build a Word game">
      <span class="act-emoji">🔨</span>
      <span class="act-info">
        <span class="act-name">Build a Word</span>
        <span class="act-words">Hear it, spell it — tap letters in order</span>
      </span>
      <span class="act-best">▶</span>
    </a>
  </div>

  <a href="../progress/" class="progress-link">📊 See progress</a>
</div>

<!-- ── SCREEN 2: Game ──────────────────────── -->
<div id="screen-game" class="screen">
  <div class="game-header">
    <button class="back-btn" onclick="goToPicker()" aria-label="Back to activities">←</button>
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
    <div class="round-label" id="round-label">1 / 10</div>
  </div>

  <div class="set-label" id="set-label"></div>

  <div class="hear-wrap">
    <button class="hear-btn" id="hear-btn" onclick="playWord()">
      <span>🔊</span>
      <span id="hear-text">Tap to hear</span>
    </button>
  </div>

  <div class="cards-row">
    <div class="card" id="card-0" onclick="handleTap(0)" role="button" aria-label="Choice 1">
      <div class="card-pic" id="pic-0"></div>
      <div class="card-word" id="word-0"></div>
    </div>
    <div class="card" id="card-1" onclick="handleTap(1)" role="button" aria-label="Choice 2">
      <div class="card-pic" id="pic-1"></div>
      <div class="card-word" id="word-1"></div>
    </div>
  </div>

  <div class="feedback hidden" id="feedback" aria-live="polite"></div>
</div>

<!-- ── SCREEN 3: Result ────────────────────── -->
<div id="screen-result" class="screen">
  <div class="result-stars" id="result-stars">⭐⭐⭐</div>
  <div class="result-score" id="result-score"></div>
  <div class="result-msg" id="result-msg"></div>
  <div class="rem-result" id="rem-result">
    <span id="rem-score-text"></span>
  </div>
  <div class="result-btns">
    <button class="btn-primary" onclick="playAgain()">Play again</button>
    <button class="btn-secondary" onclick="goToPicker()">Choose activity</button>
  </div>
</div>

<script>
// ── Word data ─────────────────────────────────────────────

const WORDS = {
  'short-a': [
    { word: 'cat', pic: '🐱' },
    { word: 'bat', pic: '🏏' },
    { word: 'hat', pic: '🎩' },
    { word: 'pan', pic: '🍳' },
    { word: 'man', pic: '👨' },
    { word: 'rat', pic: '🐀' },
    { word: 'bag', pic: '👜' },
    { word: 'van', pic: '🚐' },
    { word: 'cap', pic: '🧢' },
  ],
  'short-e': [
    { word: 'net', pic: '🕸️' },
    { word: 'pet', pic: '🐕' },
    { word: 'pen', pic: '✏️' },
    { word: 'hen', pic: '🐔' },
    { word: 'ten', pic: '🔟' },
    { word: 'bed', pic: '🛏️' },
    { word: 'jet', pic: '✈️' },
    { word: 'leg', pic: '🦵' },
    { word: 'red', pic: '🔴' },
    { word: 'egg', pic: '🥚' },
  ],
};

// Pairs for A vs E — each pair is [a-word, e-word]
const AE_PAIRS = [
  [{ word: 'pan', pic: '🍳' },  { word: 'pen', pic: '✏️' }],
  [{ word: 'man', pic: '👨' },  { word: 'men', pic: '👥' }],
  [{ word: 'bat', pic: '🏏' },  { word: 'bed', pic: '🛏️' }],
  [{ word: 'hat', pic: '🎩' },  { word: 'hen', pic: '🐔' }],
  [{ word: 'cat', pic: '🐱' },  { word: 'net', pic: '🕸️' }],
  [{ word: 'rat', pic: '🐀' },  { word: 'red', pic: '🔴' }],
  [{ word: 'bag', pic: '👜' },  { word: 'leg', pic: '🦵' }],
  [{ word: 'van', pic: '🚐' },  { word: 'ten', pic: '🔟' }],
  [{ word: 'cap', pic: '🧢' },  { word: 'egg', pic: '🥚' }],
  [{ word: 'rat', pic: '🐀' },  { word: 'pet', pic: '🐕' }],
];

const SET_LABELS = {
  'short-a': 'SHORT A WORDS',
  'short-e': 'SHORT E WORDS',
  'a-vs-e':  'A VS E — HEAR THE DIFFERENCE',
};

const ROUNDS_PER_GAME = 10;

// ── Game state ────────────────────────────────────────────

let currentSet    = null;
let rounds        = [];
let roundIndex    = 0;
let score         = 0;
let correctCard   = 0;
let answered      = false;
let wordPlayed    = false;
let missedRounds  = [];
let inRemediation = false;
let remScore      = 0;

// ── Utils ─────────────────────────────────────────────────

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function rand(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

// ── TTS ───────────────────────────────────────────────────

function speak(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(text);
  utt.lang  = 'en-GB';
  utt.rate  = 0.82;
  utt.pitch = 1.05;
  window.speechSynthesis.speak(utt);
}

// ── Round building ────────────────────────────────────────

function buildRounds(setKey) {
  if (setKey === 'a-vs-e') {
    return shuffle(AE_PAIRS).slice(0, ROUNDS_PER_GAME).map(pair => {
      const flip = Math.random() < 0.5;
      return { target: pair[flip ? 1 : 0], distractor: pair[flip ? 0 : 1] };
    });
  }

  const pool = shuffle(WORDS[setKey]);
  const used = pool.slice(0, ROUNDS_PER_GAME);
  return used.map((target, i) => {
    const others = used.filter((_, j) => j !== i);
    return { target, distractor: rand(others) };
  });
}

// ── Screens ───────────────────────────────────────────────

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

// ── Picker ────────────────────────────────────────────────

function goToPicker() {
  loadBestScores();
  showScreen('screen-pick');
}

function loadBestScores() {
  ['short-a', 'short-e', 'a-vs-e'].forEach(k => {
    const d  = JSON.parse(localStorage.getItem('saba_phonics_' + k) || '{}');
    const el = document.getElementById('best-' + k);
    if (el) el.textContent = d.bestScore > 0 ? `Best: ${d.bestScore}/${ROUNDS_PER_GAME}` : '';
  });
}

// ── Game start ────────────────────────────────────────────

function startGame(setKey) {
  currentSet    = setKey;
  rounds        = buildRounds(setKey);
  roundIndex    = 0;
  score         = 0;
  missedRounds  = [];
  inRemediation = false;
  remScore      = 0;
  answered      = false;
  wordPlayed    = false;

  document.getElementById('progress-fill').style.background = 'var(--purple)';
  document.getElementById('set-label').textContent = SET_LABELS[setKey];
  showScreen('screen-game');
  renderRound();
}

// ── Render round ──────────────────────────────────────────

function renderRound() {
  answered   = false;
  wordPlayed = false;

  const source = inRemediation ? missedRounds : rounds;
  const { target, distractor } = source[roundIndex];

  correctCard = Math.random() < 0.5 ? 0 : 1;
  const items = correctCard === 0
    ? [target, distractor]
    : [distractor, target];

  const total = source.length;
  document.getElementById('progress-fill').style.width =
    `${(roundIndex / total) * 100}%`;
  document.getElementById('round-label').textContent =
    `${roundIndex + 1} / ${total}`;

  for (let i = 0; i < 2; i++) {
    document.getElementById(`pic-${i}`).textContent  = items[i].pic;
    document.getElementById(`word-${i}`).textContent = items[i].word;
    const card = document.getElementById(`card-${i}`);
    card.className            = 'card';
    card.style.pointerEvents  = 'auto';
  }

  document.getElementById('hear-text').textContent = 'Tap to hear';
  document.getElementById('hear-btn').classList.remove('replaying');

  const fb = document.getElementById('feedback');
  fb.textContent = '';
  fb.className   = 'feedback hidden';
}

// ── Hear button ───────────────────────────────────────────

function playWord() {
  const source = inRemediation ? missedRounds : rounds;
  speak(source[roundIndex].target.word);
  if (!wordPlayed) {
    wordPlayed = true;
    document.getElementById('hear-text').textContent = 'Hear it again';
    document.getElementById('hear-btn').classList.add('replaying');
  }
}

// ── Card tap ──────────────────────────────────────────────

function handleTap(cardIndex) {
  if (answered) return;
  answered = true;

  document.getElementById('card-0').style.pointerEvents = 'none';
  document.getElementById('card-1').style.pointerEvents = 'none';

  const correct = cardIndex === correctCard;
  const fb      = document.getElementById('feedback');

  if (correct) {
    if (inRemediation) remScore++;
    else score++;
    document.getElementById(`card-${cardIndex}`).classList.add('correct');
    fb.textContent = '✓ Well done!';
    fb.className   = 'feedback correct-msg';
  } else {
    if (!inRemediation) missedRounds.push(rounds[roundIndex]);
    document.getElementById(`card-${cardIndex}`).classList.add('wrong');
    document.getElementById(`card-${correctCard}`).classList.add('correct');
    fb.textContent = 'Not quite — look at the green one!';
    fb.className   = 'feedback wrong-msg';
  }

  setTimeout(() => {
    roundIndex++;
    const source = inRemediation ? missedRounds : rounds;
    if (roundIndex >= source.length) {
      inRemediation ? showResult() : endMainGame();
    } else {
      renderRound();
    }
  }, 1800);
}

// ── End of main game ──────────────────────────────────────

function endMainGame() {
  const key  = 'saba_phonics_' + currentSet;
  const prev = JSON.parse(localStorage.getItem(key) || '{"played":0,"bestScore":0}');
  prev.played++;
  prev.bestScore  = Math.max(prev.bestScore || 0, score);
  prev.lastPlayed = new Date().toISOString().slice(0, 10);
  prev.lastMissed = missedRounds.map(r => r.target.word);
  localStorage.setItem(key, JSON.stringify(prev));

  if (missedRounds.length > 0) {
    startRemediation();
  } else {
    showResult();
  }
}

// ── Remediation ───────────────────────────────────────────

function startRemediation() {
  inRemediation = true;
  remScore      = 0;
  roundIndex    = 0;
  document.getElementById('progress-fill').style.background = 'var(--orange)';
  document.getElementById('set-label').textContent = "LET'S TRY THE TRICKY ONES AGAIN! 💪";
  showScreen('screen-game');
  renderRound();
}

// ── Result ────────────────────────────────────────────────

const MESSAGES = [
  ['🌟 Amazing! Every single one!', '⭐⭐⭐'],
  ['Great job — nearly there!',     '⭐⭐☆'],
  ['Good try — keep practising!',   '⭐☆☆'],
  ["Let's try again!",              '☆☆☆'],
];

function showResult() {
  showScreen('screen-result');

  const pct  = score / ROUNDS_PER_GAME;
  const tier = pct >= 0.9 ? 0 : pct >= 0.7 ? 1 : pct >= 0.5 ? 2 : 3;
  const [msg, stars] = MESSAGES[tier];

  document.getElementById('result-stars').textContent = stars;
  document.getElementById('result-score').textContent = `${score} out of ${ROUNDS_PER_GAME}`;
  document.getElementById('result-msg').textContent   = msg;

  const remBox = document.getElementById('rem-result');
  if (missedRounds.length > 0) {
    remBox.style.display = 'block';
    const t = missedRounds.length;
    document.getElementById('rem-score-text').textContent =
      remScore === t
        ? `Second try: got all ${t}! 🎉`
        : `Second try: ${remScore} out of ${t}`;
  } else {
    remBox.style.display = 'none';
  }
}

function playAgain() { startGame(currentSet); }

// ── Init ──────────────────────────────────────────────────

loadBestScores();
</script>
