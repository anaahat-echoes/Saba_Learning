<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Saba's Learning</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #1a1a2e;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 32px 20px;
  color: #fff;
}

.hero {
  text-align: center;
  margin-bottom: 44px;
}

.hero-icon {
  font-size: 3.8rem;
  display: block;
  margin-bottom: 12px;
}

.hero h1 {
  font-size: 2rem;
  font-weight: 900;
  color: #fff;
  letter-spacing: -0.5px;
}

.hero p {
  font-size: 1rem;
  color: rgba(255,255,255,0.6);
  margin-top: 6px;
}

/* ── World cards ─────────────────────────── */
.worlds {
  display: flex;
  flex-direction: column;
  gap: 16px;
  width: 100%;
  max-width: 380px;
  margin-bottom: 36px;
}

.world-card {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 22px 20px;
  border: none;
  border-radius: 24px;
  text-decoration: none;
  cursor: pointer;
  transition: transform 0.12s ease, box-shadow 0.12s ease;
  -webkit-tap-highlight-color: transparent;
  position: relative;
  overflow: hidden;
}

.world-card:active {
  transform: translateY(4px);
}

/* Word World — purple */
.world-phonics {
  background: linear-gradient(135deg, #7048e8 0%, #5f3dc4 100%);
  box-shadow: 0 6px 0 #3d249c;
  color: #fff;
}

.world-phonics:active {
  box-shadow: 0 2px 0 #3d249c;
}

/* Class World — green */
.world-class {
  background: linear-gradient(135deg, #2f9e44 0%, #1a7431 100%);
  box-shadow: 0 6px 0 #0d5a1e;
  color: #fff;
}

.world-class:active {
  box-shadow: 0 2px 0 #0d5a1e;
}

/* Numbers World — blue */
.world-numbers {
  background: linear-gradient(135deg, #1971c2 0%, #1259a1 100%);
  box-shadow: 0 6px 0 #0b3d6e;
  color: #fff;
}

.world-numbers:active {
  box-shadow: 0 2px 0 #0b3d6e;
}

.class-tag {
  font-size: 0.65rem;
  background: rgba(255,255,255,0.25);
  padding: 2px 8px;
  border-radius: 20px;
  font-weight: 700;
  letter-spacing: 0.04em;
  flex-shrink: 0;
}

/* Locked world */
.world-locked {
  background: rgba(255,255,255,0.08);
  box-shadow: none;
  border: 2px solid rgba(255,255,255,0.15);
  color: rgba(255,255,255,0.45);
  cursor: default;
  pointer-events: none;
}

.world-icon {
  font-size: 3rem;
  line-height: 1;
  flex-shrink: 0;
}

.world-info { flex: 1; }

.world-name {
  font-size: 1.2rem;
  font-weight: 900;
  display: block;
  margin-bottom: 4px;
}

.world-desc {
  font-size: 0.82rem;
  opacity: 0.85;
  line-height: 1.35;
}

.lock-badge {
  font-size: 1.5rem;
  flex-shrink: 0;
}

/* ── Stats ───────────────────────────────── */
.stats {
  font-size: 0.9rem;
  color: rgba(255,255,255,0.45);
  text-align: center;
}

.stats strong {
  color: #a78bfa;
  font-weight: 800;
}

.stats a {
  color: rgba(255,255,255,0.45);
  text-decoration: underline;
  margin-left: 10px;
}

/* ── Achievements ────────────────────────── */
.achievements {
  margin-bottom: 20px;
  padding: 18px 28px;
  background: rgba(255,255,255,0.06);
  border-radius: 20px;
  border: 2px solid rgba(255,255,255,0.1);
  max-width: 380px;
  width: 100%;
}

.trophy-row {
  display: flex;
  justify-content: center;
  gap: 36px;
  font-size: 1.5rem;
}

.trophy-item {
  display: flex;
  align-items: center;
  gap: 6px;
}

.trophy-item strong {
  font-weight: 900;
}

.trophy-stars strong { color: #f59f00; }
.trophy-diamonds strong { color: #22b8cf; }
</style>
</head>
<body>

<div class="hero">
  <span class="hero-icon">⭐</span>
  <h1>Saba's Learning</h1>
  <p>Let's learn together!</p>
</div>

<div class="worlds">
  <!-- Word World (English) -->
  <a href="english/" class="world-card world-phonics">
    <span class="world-icon">🔤</span>
    <div class="world-info">
      <span class="world-name">Word World</span>
      <span class="world-desc">Listen, match and build words</span>
    </div>
  </a>

  <!-- Numbers World (Math) -->
  <a href="numbers/" class="world-card world-numbers">
    <span class="world-icon">🔢</span>
    <div class="world-info">
      <span class="world-name">Numbers World</span>
      <span class="world-desc">Compare, count and skip!</span>
    </div>
  </a>

  <!-- Classes -->
  <a href="classes/" class="world-card world-class">
    <span class="world-icon">📅</span>
    <div class="world-info">
      <span class="world-name">Classes</span>
      <span class="world-desc">Activities and videos from each session</span>
    </div>
  </a>
</div>

<div class="achievements" id="achievements" style="display:none;">
  <div class="trophy-row">
    <span class="trophy-item trophy-stars">⭐ <strong id="total-stars">0</strong></span>
    <span class="trophy-item trophy-diamonds">💎 <strong id="total-diamonds">0</strong></span>
  </div>
</div>

<div class="stats">
  <strong id="total-sessions">0</strong> sessions played
  &nbsp;·&nbsp;
  <a href="progress/">📊 Progress</a>
</div>

<script>
const pairKeys   = ['short-a', 'short-e', 'a-vs-e'];
const ladderKeys = ['at','an','et','en','it','in','ot','op'];
const buildKeys  = ['today', 'more-cvc'];
const classKeys  = ['2026-08-30'];
let n = 0;
let stars = 0, diamonds = 0;

pairKeys.forEach(k => {
  const d = JSON.parse(localStorage.getItem('saba_phonics_' + k) || '{}');
  n += d.played || 0;
});
ladderKeys.forEach(k => {
  const d = JSON.parse(localStorage.getItem('saba_ladders_' + k) || '{}');
  n += d.played || 0;
});
buildKeys.forEach(k => {
  const d = JSON.parse(localStorage.getItem('saba_build_' + k) || '{}');
  n += d.played || 0;
});
classKeys.forEach(k => {
  const d = JSON.parse(localStorage.getItem('saba_class_' + k) || '{}');
  if (d.totalStars) stars += d.totalStars;
  if (d.totalDiamonds) diamonds += d.totalDiamonds;
  if (d.actResults) {
    for (const a in d.actResults) {
      if (d.actResults[a]) n++;
    }
  }
});

document.getElementById('total-sessions').textContent = n;

if (stars > 0 || diamonds > 0) {
  document.getElementById('achievements').style.display = '';
  document.getElementById('total-stars').textContent = stars;
  document.getElementById('total-diamonds').textContent = diamonds;
}
</script>

</body>
</html>
