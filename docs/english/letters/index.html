<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Letter Sounds</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --purple:      #7048e8;
  --purple-dark: #5f3dc4;
  --green:       #2f9e44;
  --red:         #e03131;
  --gold:        #f59f00;
  --gray:        rgba(255,255,255,0.5);
  --bg:          #1a1a2e;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  min-height: 100vh;
  color: #fff;
  -webkit-tap-highlight-color: transparent;
}

.screen { display: none; min-height: 100vh; }
.screen.active { display: flex; flex-direction: column; }

/* ── Header ──────────────────────────────── */
.page-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 20px 12px;
  flex-shrink: 0;
}

.back-btn {
  background: rgba(255,255,255,0.1);
  border: none;
  border-radius: 50%;
  width: 40px; height: 40px;
  font-size: 1.1rem;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  color: rgba(255,255,255,0.7);
  text-decoration: none;
}

.page-title {
  font-size: 1.05rem;
  font-weight: 700;
  color: rgba(255,255,255,0.9);
  flex: 1;
}

/* ── Picker ─────────────────────────────── */
#screen-pick { padding: 0 20px 40px; }

.pick-heading {
  font-size: 1.5rem;
  font-weight: 900;
  margin-bottom: 6px;
  padding: 0 4px;
}

.pick-sub {
  font-size: 0.9rem;
  color: var(--gray);
  margin-bottom: 22px;
  padding: 0 4px;
}

.group-list {
  display: flex;
  flex-direction: column;
  gap: 14px;
  max-width: 480px;
  margin: 0 auto;
}

.group-card {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 18px 20px;
  border-radius: 20px;
  background: rgba(255,255,255,0.06);
  border: 2px solid rgba(255,255,255,0.08);
  box-shadow: 0 4px 0 rgba(0,0,0,0.25);
  cursor: pointer;
  border-left: 5px solid var(--purple);
  transition: transform 0.1s, box-shadow 0.1s;
  color: #fff;
}

.group-card:active {
  transform: translateY(3px);
  box-shadow: 0 1px 0 rgba(0,0,0,0.25);
}

.group-emoji {
  font-size: 2.6rem;
  min-width: 50px;
  text-align: center;
  font-family: 'Courier New', monospace;
  font-weight: 900;
}

.group-info { flex: 1; }

.group-name {
  font-size: 1.05rem;
  font-weight: 800;
  display: block;
  margin-bottom: 3px;
}

.group-desc {
  font-size: 0.8rem;
  color: rgba(255,255,255,0.45);
  font-family: 'Courier New', monospace;
  letter-spacing: 0.1em;
}

.group-best {
  font-size: 0.75rem;
  font-weight: 700;
  color: var(--gold);
  text-align: right;
  white-space: nowrap;
}

/* ── Game screen ──────────────────────────── */
#screen-game { padding-bottom: 24px; }

.game-progress {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 20px 12px;
}

.progress-track {
  flex: 1;
  height: 8px;
  background: rgba(255,255,255,0.1);
  border-radius: 4px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: var(--purple);
  border-radius: 4px;
  transition: width 0.4s ease;
  width: 0%;
}

.round-label {
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--gray);
  white-space: nowrap;
}

.prompt-stage {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 24px 20px 12px;
}

.prompt-pic {
  font-size: 5.5rem;
  line-height: 1;
  margin-bottom: 16px;
}

.hear-btn {
  background: var(--purple);
  color: #fff;
  border: none;
  border-radius: 50px;
  padding: 16px 36px;
  font-size: 1.1rem;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 5px 0 var(--purple-dark);
  transition: transform 0.1s, box-shadow 0.1s;
  display: flex;
  align-items: center;
  gap: 10px;
}

.hear-btn:active {
  transform: translateY(4px);
  box-shadow: 0 1px 0 var(--purple-dark);
}

.letter-row {
  display: flex;
  justify-content: center;
  gap: 16px;
  padding: 28px 20px;
  flex-wrap: wrap;
}

.letter-tile {
  width: 100px;
  height: 100px;
  border-radius: 24px;
  background: rgba(255,255,255,0.08);
  border: 4px solid transparent;
  font-family: 'Courier New', monospace;
  font-size: 3rem;
  font-weight: 900;
  color: #fff;
  cursor: pointer;
  box-shadow: 0 5px 0 rgba(0,0,0,0.25);
  transition: transform 0.08s, box-shadow 0.08s, background 0.2s;
}

.letter-tile:active {
  transform: translateY(4px);
  box-shadow: 0 1px 0 rgba(0,0,0,0.25);
}

.letter-tile.correct { border-color: var(--green); background: rgba(47,158,68,0.25); }
.letter-tile.wrong { border-color: var(--red); background: rgba(224,49,49,0.15); animation: shake 0.4s ease; }

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-8px); }
  40% { transform: translateX(8px); }
  60% { transform: translateX(-6px); }
  80% { transform: translateX(6px); }
}

.feedback {
  text-align: center;
  padding: 10px 20px 0;
  font-size: 1.1rem;
  font-weight: 700;
  min-height: 48px;
}

.feedback.ok { color: var(--green); }
.feedback.no { color: var(--red); }
.feedback.hidden { visibility: hidden; }

/* ── Result ───────────────────────────────── */
#screen-result {
  align-items: center;
  justify-content: center;
  padding: 32px 24px;
  text-align: center;
}

.result-stars { font-size: 3rem; margin-bottom: 16px; letter-spacing: 4px; }
.result-score { font-size: 2rem; font-weight: 900; color: #a78bfa; margin-bottom: 8px; }
.result-msg { font-size: 1rem; color: var(--gray); margin-bottom: 28px; }

.result-btns {
  display: flex;
  flex-direction: column;
  gap: 14px;
  width: 100%;
  max-width: 300px;
}

.btn-primary {
  background: var(--purple);
  color: #fff;
  border: none;
  border-radius: 50px;
  padding: 18px 32px;
  font-size: 1.05rem;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 5px 0 var(--purple-dark);
}

.btn-primary:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--purple-dark); }

.btn-secondary {
  background: transparent;
  color: rgba(255,255,255,0.6);
  border: 2px solid rgba(255,255,255,0.2);
  border-radius: 50px;
  padding: 16px 32px;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
}
</style>
</head>
<body>

<!-- ── SCREEN 1: Group Picker ────────────── -->
<div id="screen-pick" class="screen active">
  <div class="page-header">
    <button class="back-btn" onclick="goBack()" aria-label="Back">←</button>
    <span class="page-title">🔤 Letter Sounds</span>
  </div>

  <div style="padding: 8px 24px 0;">
    <div class="pick-heading">Letter Sounds</div>
    <div class="pick-sub">Hear a word, tap the letter it starts with</div>
  </div>

  <div class="group-list" style="padding: 0 4px;">
    <button class="group-card" onclick="startGroup('group1')">
      <span class="group-emoji">s</span>
      <span class="group-info">
        <span class="group-name">Group 1</span>
        <span class="group-desc">s · a · t · p · i · n</span>
      </span>
      <span class="group-best" id="best-group1"></span>
    </button>
  </div>
</div>

<!-- ── SCREEN 2: Game ──────────────────────── -->
<div id="screen-game" class="screen">
  <div class="page-header">
    <button class="back-btn" onclick="goBack()" aria-label="Back to picker">←</button>
    <span class="page-title" id="game-title">Group 1</span>
  </div>

  <div class="game-progress">
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="round-label" id="round-label">1 / 12</div>
  </div>

  <div class="prompt-stage">
    <div class="prompt-pic" id="prompt-pic"></div>
    <button class="hear-btn" id="hear-btn" onclick="playWord()">
      <span>🔊</span>
      <span id="hear-text">Tap to hear</span>
    </button>
  </div>

  <div class="letter-row" id="letter-row"></div>

  <div class="feedback hidden" id="feedback"></div>
</div>

<!-- ── SCREEN 3: Result ────────────────────── -->
<div id="screen-result" class="screen">
  <div class="result-stars" id="result-stars">⭐⭐⭐</div>
  <div class="result-score" id="result-score"></div>
  <div class="result-msg" id="result-msg"></div>
  <div class="result-btns">
    <button class="btn-primary" onclick="playAgain()">Play again</button>
    <button class="btn-secondary" onclick="goToPicker()">Choose a group</button>
  </div>
</div>

<script>
// ── Letter group data ───────────────────────────────────────

const LETTER_GROUPS = {
  'group1': {
    title: 'Group 1',
    letters: [
      { letter: 's', word: 'sun', pic: '☀️' },
      { letter: 'a', word: 'ant', pic: '🐜' },
      { letter: 't', word: 'ten', pic: '🔟' },
      { letter: 'p', word: 'pig', pic: '🐷' },
      { letter: 'i', word: 'ink', pic: '🖋️' },
      { letter: 'n', word: 'net', pic: '🕸️' },
    ],
  },
};

const ROUNDS_PER_GAME = 12;

// ── Game state ────────────────────────────────────────────

let currentGroup = null;
let rounds       = [];
let roundIndex   = 0;
let score        = 0;
let correctIdx   = 0;
let answered     = false;
let wordPlayed   = false;

// ── Utils ─────────────────────────────────────────────────

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ── TTS ───────────────────────────────────────────────────

function speak(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  setTimeout(() => {
    if (window.speechSynthesis.paused) window.speechSynthesis.resume();
    const utt = new SpeechSynthesisUtterance(text);
    utt.lang  = 'en-GB';
    utt.rate  = 0.78;
    utt.pitch = 1.05;
    window.speechSynthesis.speak(utt);
  }, 60);
}

// ── Round building ────────────────────────────────────────

function buildRounds(groupKey) {
  const letters = LETTER_GROUPS[groupKey].letters;
  // Two passes through the group, each pass shuffled, so letters
  // repeat but never appear twice in a row.
  return shuffle(letters).concat(shuffle(letters)).slice(0, ROUNDS_PER_GAME);
}

// ── Screens ───────────────────────────────────────────────

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

// ── Picker ────────────────────────────────────────────────

function loadBestScores() {
  Object.keys(LETTER_GROUPS).forEach(k => {
    const d  = JSON.parse(localStorage.getItem('saba_letters_' + k) || '{}');
    const el = document.getElementById('best-' + k);
    if (el) el.textContent = d.bestScore > 0 ? `Best: ${d.bestScore}/${ROUNDS_PER_GAME}` : '';
  });
}

function goToPicker() {
  loadBestScores();
  showScreen('screen-pick');
}

function goBack() {
  const backUrl = urlParams.get('back');
  window.location.href = backUrl || '../';
}

// ── Game start ────────────────────────────────────────────

function startGroup(groupKey) {
  currentGroup = groupKey;
  rounds       = buildRounds(groupKey);
  roundIndex   = 0;
  score        = 0;
  answered     = false;
  wordPlayed   = false;

  document.getElementById('game-title').textContent = LETTER_GROUPS[groupKey].title;
  showScreen('screen-game');
  renderRound();
}

// ── Render round ──────────────────────────────────────────

function renderRound() {
  answered   = false;
  wordPlayed = false;

  const target = rounds[roundIndex];
  const total  = rounds.length;

  document.getElementById('progress-fill').style.width = `${(roundIndex / total) * 100}%`;
  document.getElementById('round-label').textContent = `${roundIndex + 1} / ${total}`;

  document.getElementById('prompt-pic').textContent = target.pic;
  document.getElementById('hear-text').textContent  = 'Tap to hear';
  document.getElementById('hear-btn').classList.remove('replaying');

  const allLetters = LETTER_GROUPS[currentGroup].letters;
  const others = allLetters.filter(l => l.letter !== target.letter);
  const distractors = shuffle(others).slice(0, 2);
  const options = shuffle([target, ...distractors]);
  correctIdx = options.findIndex(o => o.letter === target.letter);

  const row = document.getElementById('letter-row');
  row.innerHTML = '';
  options.forEach((opt, i) => {
    const tile = document.createElement('button');
    tile.className = 'letter-tile';
    tile.textContent = opt.letter;
    tile.onclick = () => handleTap(i, opt.letter === target.letter);
    row.appendChild(tile);
  });

  const fb = document.getElementById('feedback');
  fb.textContent = '';
  fb.className = 'feedback hidden';

  // Auto-play the word once per round to support early readers.
  setTimeout(() => playWord(), 400);
}

// ── Hear button ───────────────────────────────────────────

function playWord() {
  speak(rounds[roundIndex].word);
  if (!wordPlayed) {
    wordPlayed = true;
    document.getElementById('hear-text').textContent = 'Hear it again';
    document.getElementById('hear-btn').classList.add('replaying');
  }
}

// ── Tile tap ──────────────────────────────────────────────

function handleTap(tileIdx, correct) {
  if (answered) return;
  answered = true;

  const tiles = document.querySelectorAll('.letter-tile');
  tiles.forEach(t => t.style.pointerEvents = 'none');

  const fb = document.getElementById('feedback');
  if (correct) {
    tiles[tileIdx].classList.add('correct');
    fb.textContent = '✓ Well done!';
    fb.className = 'feedback ok';
    score++;
  } else {
    tiles[tileIdx].classList.add('wrong');
    tiles[correctIdx].classList.add('correct');
    fb.textContent = 'Not quite — look at the green one!';
    fb.className = 'feedback no';
  }

  setTimeout(() => {
    roundIndex++;
    if (roundIndex >= rounds.length) endGame();
    else renderRound();
  }, 1800);
}

// ── End of game ───────────────────────────────────────────

function endGame() {
  const key  = 'saba_letters_' + currentGroup;
  const prev = JSON.parse(localStorage.getItem(key) || '{"played":0,"bestScore":0}');
  prev.played++;
  prev.bestScore  = Math.max(prev.bestScore || 0, score);
  prev.lastPlayed = new Date().toISOString().slice(0, 10);
  localStorage.setItem(key, JSON.stringify(prev));

  showResult();
}

// ── Result ────────────────────────────────────────────────

const MESSAGES = [
  ['🌟 Amazing! Every single one!', '⭐⭐⭐'],
  ['Great job — nearly there!',     '⭐⭐☆'],
  ['Good try — keep practising!',   '⭐☆☆'],
  ["Let's try again!",              '☆☆☆'],
];

function showResult() {
  showScreen('screen-result');

  const pct  = score / ROUNDS_PER_GAME;
  const tier = pct >= 0.9 ? 0 : pct >= 0.7 ? 1 : pct >= 0.5 ? 2 : 3;
  const [msg, stars] = MESSAGES[tier];

  document.getElementById('result-stars').textContent = stars;
  document.getElementById('result-score').textContent = `${score} out of ${ROUNDS_PER_GAME}`;
  document.getElementById('result-msg').textContent   = msg;
}

function playAgain() { startGroup(currentGroup); }

// ── Init ──────────────────────────────────────────────────

loadBestScores();

const urlParams = new URLSearchParams(location.search);
const requestedGroup = urlParams.get('group');
if (requestedGroup && LETTER_GROUPS[requestedGroup]) {
  startGroup(requestedGroup);
}
</script>

</body>
</html>
