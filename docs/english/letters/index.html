<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Letter Sounds</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --purple:      #7048e8;
  --purple-dark: #5f3dc4;
  --green:       #2f9e44;
  --red:         #e03131;
  --gold:        #f59f00;
  --gray:        rgba(255,255,255,0.5);
  --bg:          #1a1a2e;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  min-height: 100vh;
  color: #fff;
  -webkit-tap-highlight-color: transparent;
}

.screen { display: none; min-height: 100vh; }
.screen.active { display: flex; flex-direction: column; }
[hidden] { display: none !important; }

/* ── Header ──────────────────────────────── */
.page-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 20px 12px;
  flex-shrink: 0;
}

.back-btn {
  background: rgba(255,255,255,0.1);
  border: none;
  border-radius: 50%;
  width: 40px; height: 40px;
  font-size: 1.1rem;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  color: rgba(255,255,255,0.7);
  text-decoration: none;
}

.page-title {
  font-size: 1.05rem;
  font-weight: 700;
  color: rgba(255,255,255,0.9);
  flex: 1;
}

/* ── Picker ─────────────────────────────── */
#screen-pick { padding: 0 20px 40px; }

.pick-heading {
  font-size: 1.5rem;
  font-weight: 900;
  margin-bottom: 6px;
  padding: 0 4px;
}

.pick-sub {
  font-size: 0.9rem;
  color: var(--gray);
  margin-bottom: 22px;
  padding: 0 4px;
}

.group-list {
  display: flex;
  flex-direction: column;
  gap: 14px;
  max-width: 480px;
  margin: 0 auto;
}

.group-card {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 18px 20px;
  border-radius: 20px;
  background: rgba(255,255,255,0.06);
  border: 2px solid rgba(255,255,255,0.08);
  box-shadow: 0 4px 0 rgba(0,0,0,0.25);
  cursor: pointer;
  border-left: 5px solid var(--purple);
  transition: transform 0.1s, box-shadow 0.1s;
  color: #fff;
}

.group-card:active {
  transform: translateY(3px);
  box-shadow: 0 1px 0 rgba(0,0,0,0.25);
}

.group-emoji {
  font-size: 2.6rem;
  min-width: 50px;
  text-align: center;
  font-family: 'Courier New', monospace;
  font-weight: 900;
}

.group-info { flex: 1; }

.group-name {
  font-size: 1.05rem;
  font-weight: 800;
  display: block;
  margin-bottom: 3px;
}

.group-desc {
  font-size: 0.8rem;
  color: rgba(255,255,255,0.45);
  font-family: 'Courier New', monospace;
  letter-spacing: 0.1em;
}

.group-best {
  font-size: 0.75rem;
  font-weight: 700;
  color: var(--gold);
  text-align: right;
  white-space: nowrap;
}

/* ── Game screen ──────────────────────────── */
#screen-game { padding-bottom: 24px; }

.game-progress {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 20px 12px;
}

.progress-track {
  flex: 1;
  height: 8px;
  background: rgba(255,255,255,0.1);
  border-radius: 4px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: var(--purple);
  border-radius: 4px;
  transition: width 0.4s ease;
  width: 0%;
}

.round-label {
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--gray);
  white-space: nowrap;
}

/* ── Flashcard ─────────────────────────────── */
.flashcard-stage {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 16px 20px;
}

.flashcard-pic {
  font-size: 8rem;
  line-height: 1;
  margin-bottom: 20px;
}

.flashcard-letter {
  font-family: 'Courier New', monospace;
  font-size: 1.8rem;
  font-weight: 900;
  color: var(--gold);
  background: rgba(245,159,0,0.15);
  border-radius: 16px;
  padding: 4px 18px;
  margin-bottom: 10px;
}

.flashcard-word {
  font-family: 'Courier New', monospace;
  font-size: 2.2rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  margin-bottom: 28px;
}

.hear-btn {
  background: var(--purple);
  color: #fff;
  border: none;
  border-radius: 50px;
  padding: 16px 36px;
  font-size: 1.1rem;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 5px 0 var(--purple-dark);
  transition: transform 0.1s, box-shadow 0.1s;
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 20px;
}

.hear-btn:active {
  transform: translateY(4px);
  box-shadow: 0 1px 0 var(--purple-dark);
}

.next-btn {
  background: var(--green);
  color: #fff;
  border: none;
  border-radius: 50px;
  padding: 16px 40px;
  font-size: 1.05rem;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 5px 0 #1a7431;
}

.next-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #1a7431; }

/* ── I Spy ─────────────────────────────────── */
.ispy-prompt {
  text-align: center;
  font-size: 1.15rem;
  font-weight: 800;
  padding: 24px 20px 20px;
}

.ispy-prompt .target-letter {
  font-family: 'Courier New', monospace;
  color: var(--gold);
  font-size: 1.4rem;
}

.ispy-grid {
  display: flex;
  justify-content: center;
  gap: 18px;
  padding: 0 20px 20px;
  flex-wrap: wrap;
}

.ispy-tile {
  width: 120px;
  height: 120px;
  border-radius: 24px;
  background: rgba(255,255,255,0.08);
  border: 4px solid transparent;
  font-size: 3.6rem;
  cursor: pointer;
  box-shadow: 0 5px 0 rgba(0,0,0,0.25);
  transition: transform 0.08s, box-shadow 0.08s, background 0.2s, opacity 0.2s;
}

.ispy-tile:active {
  transform: translateY(4px);
  box-shadow: 0 1px 0 rgba(0,0,0,0.25);
}

.ispy-tile.found { border-color: var(--green); background: rgba(47,158,68,0.3); opacity: 0.6; pointer-events: none; }
.ispy-tile.wrong { border-color: var(--red); background: rgba(224,49,49,0.15); animation: shake 0.4s ease; }

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-8px); }
  40% { transform: translateX(8px); }
  60% { transform: translateX(-6px); }
  80% { transform: translateX(6px); }
}

.ispy-counter {
  text-align: center;
  font-size: 0.9rem;
  color: var(--gray);
  font-weight: 700;
  padding-bottom: 8px;
}

.feedback {
  text-align: center;
  padding: 10px 20px 0;
  font-size: 1.1rem;
  font-weight: 700;
  min-height: 48px;
}

.feedback.ok { color: var(--green); }
.feedback.hidden { visibility: hidden; }

/* ── Result ───────────────────────────────── */
#screen-result {
  align-items: center;
  justify-content: center;
  padding: 32px 24px;
  text-align: center;
}

.result-stars { font-size: 3rem; margin-bottom: 16px; letter-spacing: 4px; }
.result-msg { font-size: 1.1rem; color: var(--gray); margin-bottom: 28px; }

.result-btns {
  display: flex;
  flex-direction: column;
  gap: 14px;
  width: 100%;
  max-width: 300px;
}

.btn-primary {
  background: var(--purple);
  color: #fff;
  border: none;
  border-radius: 50px;
  padding: 18px 32px;
  font-size: 1.05rem;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 5px 0 var(--purple-dark);
}

.btn-primary:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--purple-dark); }

.btn-secondary {
  background: transparent;
  color: rgba(255,255,255,0.6);
  border: 2px solid rgba(255,255,255,0.2);
  border-radius: 50px;
  padding: 16px 32px;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
}
</style>
</head>
<body>

<!-- ── SCREEN 1: Group Picker ────────────── -->
<div id="screen-pick" class="screen active">
  <div class="page-header">
    <button class="back-btn" onclick="goBack()" aria-label="Back">←</button>
    <span class="page-title">🔤 Letter Sounds</span>
  </div>

  <div style="padding: 8px 24px 0;">
    <div class="pick-heading">Letter Sounds</div>
    <div class="pick-sub">Two words per letter, then spy them</div>
  </div>

  <div class="group-list" style="padding: 0 4px;">
    <button class="group-card" onclick="startGroup('group1')">
      <span class="group-emoji">s</span>
      <span class="group-info">
        <span class="group-name">S &amp; A</span>
        <span class="group-desc">sun · sock · ant · apple</span>
      </span>
      <span class="group-best" id="best-group1"></span>
    </button>
  </div>
</div>

<!-- ── SCREEN 2: Game ──────────────────────── -->
<div id="screen-game" class="screen">
  <div class="page-header">
    <button class="back-btn" onclick="goBack()" aria-label="Back">←</button>
    <span class="page-title" id="game-title">Letter Sounds</span>
  </div>

  <div class="game-progress">
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="round-label" id="round-label">1 / 6</div>
  </div>

  <!-- Flashcard -->
  <div id="stage-flashcard" hidden>
    <div class="flashcard-stage">
      <div class="flashcard-pic" id="flashcard-pic"></div>
      <div class="flashcard-letter" id="flashcard-letter"></div>
      <div class="flashcard-word" id="flashcard-word"></div>
      <button class="hear-btn" id="hear-btn" onclick="playWord()">
        <span>🔊</span>
        <span id="hear-text">Tap to hear</span>
      </button>
      <button class="next-btn" onclick="nextFlashcard()">Next →</button>
    </div>
  </div>

  <!-- I Spy -->
  <div id="stage-ispy" hidden>
    <div class="ispy-prompt">
      Find everything that starts with <span class="target-letter" id="ispy-letter"></span>
    </div>
    <div class="ispy-counter" id="ispy-counter"></div>
    <div class="ispy-grid" id="ispy-grid"></div>
  </div>

  <div class="feedback hidden" id="feedback"></div>
</div>

<!-- ── SCREEN 3: Result ────────────────────── -->
<div id="screen-result" class="screen">
  <div class="result-stars" id="result-stars">⭐⭐⭐</div>
  <div class="result-msg" id="result-msg"></div>
  <div class="result-btns">
    <button class="btn-primary" onclick="playAgain()">Play again</button>
    <button class="btn-secondary" onclick="goToPicker()">Choose letters</button>
  </div>
</div>

<script>
// ── Letter group data ───────────────────────────────────────

const LETTER_GROUPS = {
  'group1': {
    title: 'S & A',
    activeLetters: ['s', 'a'],
    letters: {
      s: [{ word: 'sun',   pic: '☀️' }, { word: 'sock',  pic: '🧦' }],
      a: [{ word: 'ant',   pic: '🐜' }, { word: 'apple', pic: '🍎' }],
      t: [{ word: 'ten',   pic: '🔟' }, { word: 'tap',   pic: '👆' }],
      p: [{ word: 'pig',   pic: '🐷' }, { word: 'pot',   pic: '🍲' }],
      i: [{ word: 'ink',   pic: '🖋️' }, { word: 'igloo', pic: '🧊' }],
      n: [{ word: 'net',   pic: '🕸️' }, { word: 'nut',   pic: '🥜' }],
    },
  },
};

// ── Game state ────────────────────────────────────────────

let currentGroup = null;
let rounds       = [];
let roundIndex   = 0;
let score        = 0;
let wordPlayed   = false;
let ispyFound    = 0;
let ispyNeeded   = 0;
let answered     = false;

// ── Utils ─────────────────────────────────────────────────

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function allLetters(groupKey) {
  return Object.keys(LETTER_GROUPS[groupKey].letters);
}

function randomWord(groupKey, letter) {
  const words = LETTER_GROUPS[groupKey].letters[letter];
  return words[Math.floor(Math.random() * words.length)];
}

// ── TTS ───────────────────────────────────────────────────

function speak(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  setTimeout(() => {
    if (window.speechSynthesis.paused) window.speechSynthesis.resume();
    const utt = new SpeechSynthesisUtterance(text);
    utt.lang  = 'en-GB';
    utt.rate  = 0.78;
    utt.pitch = 1.05;
    window.speechSynthesis.speak(utt);
  }, 60);
}

// ── Round building ────────────────────────────────────────
// Per letter: a flashcard for each of its 2 words, then I Spy.

function buildRounds(groupKey) {
  const built = [];
  LETTER_GROUPS[groupKey].activeLetters.forEach(letter => {
    LETTER_GROUPS[groupKey].letters[letter].forEach(word => {
      built.push({ type: 'flashcard', letter, word });
    });
    built.push({ type: 'ispy', letter });
  });
  return built;
}

// ── Screens ───────────────────────────────────────────────

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

function showStage(id) {
  ['stage-flashcard', 'stage-ispy'].forEach(s => {
    document.getElementById(s).hidden = (s !== id);
  });
}

// ── Picker ────────────────────────────────────────────────

function loadBestScores() {
  Object.keys(LETTER_GROUPS).forEach(k => {
    const d = JSON.parse(localStorage.getItem('saba_letters_' + k) || '{}');
    const el = document.getElementById('best-' + k);
    if (el) el.textContent = d.played > 0 ? `Played ${d.played}×` : '';
  });
}

function goToPicker() {
  loadBestScores();
  showScreen('screen-pick');
}

function goBack() {
  const backUrl = urlParams.get('back');
  window.location.href = backUrl || '../';
}

// ── Game start ────────────────────────────────────────────

function startGroup(groupKey) {
  currentGroup = groupKey;
  rounds       = buildRounds(groupKey);
  roundIndex   = 0;
  score        = 0;
  wordPlayed   = false;

  document.getElementById('game-title').textContent = LETTER_GROUPS[groupKey].title;
  showScreen('screen-game');
  renderRound();
}

// ── Render round ──────────────────────────────────────────

function renderRound() {
  wordPlayed = false;
  answered   = false;

  const round = rounds[roundIndex];
  const total = rounds.length;

  document.getElementById('progress-fill').style.width = `${(roundIndex / total) * 100}%`;
  document.getElementById('round-label').textContent = `${roundIndex + 1} / ${total}`;

  const fb = document.getElementById('feedback');
  fb.textContent = '';
  fb.className = 'feedback hidden';

  if (round.type === 'flashcard') renderFlashcard(round);
  else renderISpy(round);
}

// ── Flashcard ─────────────────────────────────────────────

function renderFlashcard(round) {
  showStage('stage-flashcard');

  document.getElementById('flashcard-pic').textContent = round.word.pic;
  document.getElementById('flashcard-letter').textContent = round.letter;
  document.getElementById('flashcard-word').textContent = round.word.word;
  document.getElementById('hear-text').textContent = 'Tap to hear';

  setTimeout(() => playWord(), 400);
}

function playWord() {
  speak(rounds[roundIndex].word.word);
  if (!wordPlayed) {
    wordPlayed = true;
    document.getElementById('hear-text').textContent = 'Hear it again';
  }
}

function nextFlashcard() {
  score++;
  advanceAfter(0);
}

// ── I Spy ─────────────────────────────────────────────────

function renderISpy(round) {
  showStage('stage-ispy');

  document.getElementById('ispy-letter').textContent = round.letter;

  const matching = LETTER_GROUPS[currentGroup].letters[round.letter];
  const otherLetters = allLetters(currentGroup).filter(l => l !== round.letter);
  const distractorLetter = shuffle(otherLetters)[0];
  const distractor = randomWord(currentGroup, distractorLetter);

  const scene = shuffle([
    ...matching.map(w => ({ ...w, isMatch: true })),
    { ...distractor, isMatch: false },
  ]);

  ispyFound  = 0;
  ispyNeeded = matching.length;
  document.getElementById('ispy-counter').textContent = `Found 0 of ${ispyNeeded}`;

  const grid = document.getElementById('ispy-grid');
  grid.innerHTML = '';
  scene.forEach(item => {
    const tile = document.createElement('button');
    tile.className = 'ispy-tile';
    tile.textContent = item.pic;
    tile.onclick = () => handleISpyTap(tile, item.isMatch, item.word);
    grid.appendChild(tile);
  });
}

function handleISpyTap(tile, isMatch, word) {
  if (answered) return;

  if (isMatch) {
    tile.classList.add('found');
    speak(word);
    ispyFound++;
    document.getElementById('ispy-counter').textContent = `Found ${ispyFound} of ${ispyNeeded}`;

    if (ispyFound >= ispyNeeded) {
      answered = true;
      score++;
      const fb = document.getElementById('feedback');
      fb.textContent = '✓ Found them all!';
      fb.className = 'feedback ok';
      advanceAfter(1500);
    }
  } else {
    tile.classList.add('wrong');
    setTimeout(() => tile.classList.remove('wrong'), 400);
  }
}

// ── Advance ───────────────────────────────────────────────

function advanceAfter(ms) {
  setTimeout(() => {
    roundIndex++;
    if (roundIndex >= rounds.length) endGame();
    else renderRound();
  }, ms);
}

// ── End of game ───────────────────────────────────────────

function endGame() {
  const key  = 'saba_letters_' + currentGroup;
  const prev = JSON.parse(localStorage.getItem(key) || '{"played":0}');
  prev.played++;
  prev.lastPlayed = new Date().toISOString().slice(0, 10);
  localStorage.setItem(key, JSON.stringify(prev));

  showResult();
}

// ── Result ────────────────────────────────────────────────

function showResult() {
  showScreen('screen-result');
  document.getElementById('result-stars').textContent = '⭐⭐⭐';
  document.getElementById('result-msg').textContent = '🌟 Great job learning letter sounds!';
}

function playAgain() { startGroup(currentGroup); }

// ── Init ──────────────────────────────────────────────────

loadBestScores();

const urlParams = new URLSearchParams(location.search);
const requestedGroup = urlParams.get('group');
if (requestedGroup && LETTER_GROUPS[requestedGroup]) {
  startGroup(requestedGroup);
}
</script>

</body>
</html>
