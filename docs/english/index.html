<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Word World</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #1a1a2e;
  min-height: 100vh;
  color: #fff;
  -webkit-tap-highlight-color: transparent;
  display: flex;
  flex-direction: column;
}

.page-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 20px 12px;
}

.back-btn {
  background: rgba(255,255,255,0.1);
  border: none;
  border-radius: 50%;
  width: 40px; height: 40px;
  font-size: 1.1rem;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  color: rgba(255,255,255,0.7);
  text-decoration: none;
}

.pick-heading {
  font-size: 1.5rem;
  font-weight: 900;
  color: #fff;
  margin-bottom: 6px;
  padding: 0 24px;
}

.pick-sub {
  font-size: 0.9rem;
  color: rgba(255,255,255,0.5);
  margin-bottom: 22px;
  padding: 0 24px;
}

.activity-list {
  display: flex;
  flex-direction: column;
  gap: 14px;
  width: 100%;
  max-width: 480px;
  margin: 0 auto;
  padding: 0 20px;
}

.act-btn {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 18px 20px;
  border: none;
  border-radius: 20px;
  background: rgba(255,255,255,0.06);
  border: 2px solid rgba(255,255,255,0.08);
  box-shadow: 0 4px 0 rgba(0,0,0,0.25);
  cursor: pointer;
  text-align: left;
  transition: transform 0.1s, box-shadow 0.1s;
  width: 100%;
  text-decoration: none;
  color: #fff;
}

.act-btn:active {
  transform: translateY(3px);
  box-shadow: 0 1px 0 rgba(0,0,0,0.25);
}

.act-emoji {
  font-size: 2.6rem;
  line-height: 1;
  min-width: 50px;
  text-align: center;
}

.act-info { flex: 1; }

.act-name {
  font-size: 1.1rem;
  font-weight: 800;
  color: #fff;
  display: block;
  margin-bottom: 4px;
}

.act-desc {
  font-size: 0.82rem;
  color: rgba(255,255,255,0.45);
  line-height: 1.35;
}

.act-arrow {
  font-size: 1.2rem;
  color: rgba(255,255,255,0.3);
  flex-shrink: 0;
}

.act-btn.color-listen  { border-left: 5px solid #f08c00; }
.act-btn.color-ladders { border-left: 5px solid #1971c2; }
.act-btn.color-build   { border-left: 5px solid #2f9e44; }

.progress-link {
  display: block;
  text-align: center;
  margin-top: 32px;
  padding-bottom: 40px;
  font-size: 0.9rem;
  font-weight: 700;
  color: #a78bfa;
  text-decoration: none;
}
</style>
</head>
<body>

<div class="page-header">
  <a href="../" class="back-btn" aria-label="Home">←</a>
</div>

<div class="pick-heading">Word World</div>
<div class="pick-sub">Tap an activity to start</div>

<div class="activity-list">
  <a href="listen/" class="act-btn color-listen" aria-label="Listen and Match">
    <span class="act-emoji">👂</span>
    <span class="act-info">
      <span class="act-name">Listen & Match</span>
      <span class="act-desc">Hear a word, tap the picture — Short A, E, I, U and vowel contrasts</span>
    </span>
    <span class="act-arrow">▶</span>
  </a>

  <a href="ladders/" class="act-btn color-ladders" aria-label="Word Ladders">
    <span class="act-emoji">🪜</span>
    <span class="act-info">
      <span class="act-name">Word Ladders</span>
      <span class="act-desc">Swap one letter at a time — Short A & E, I & O, U families</span>
    </span>
    <span class="act-arrow">▶</span>
  </a>

  <a href="build/" class="act-btn color-build" aria-label="Build a Word">
    <span class="act-emoji">🔨</span>
    <span class="act-info">
      <span class="act-name">Build a Word</span>
      <span class="act-desc">Hear it, spell it — tap letters in order</span>
    </span>
    <span class="act-arrow">▶</span>
  </a>
</div>

<a href="../progress/" class="progress-link">📊 See progress</a>

</body>
</html>
